<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>i still love you.</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      display: grid;
      place-items: center;
      height: 100vh;
      background-color: black;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-family: "Space Mono", monospace;
      font-size: clamp(0.5rem, 2.5vw, 2rem);
      color: white;
      padding: 0rem clamp(1rem, 2vw, 3rem);
      border-radius: clamp(0.4rem, 0.75vw, 1rem);
      cursor: pointer;
      display: inline-block;
      white-space: nowrap;
      transition: color 0.35s ease, background-color 0.35s ease;
    }

    h1.hovered {
      background-color: white;
      color: black;
    }

    .scrambling {
      transition: opacity 0.2s ease;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <h1 data-value="aWxsIGJlIGhlcmUgd2FpdGluZyBmb3IgeW91LCBkYW5pLiA=">
    HEY, CLICK ON ME AND THEN DECODE ME USING BASE64.
  </h1>

<script>
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[];',/{}:";
  const initialText = "HEY, CLICK ON ME AND THEN DECODE ME USING BASE64.";
  const targetText = document.querySelector("h1").dataset.value;

  let interval = null;
  const heading = document.querySelector("h1");
  let isDecoded = false;

  /* ————————— SOUND SYSTEM ————————— */
  const soundFiles = [
    "https://raw.githubusercontent.com/venti-latte/for-you/refs/heads/main/Futuristic%20Keypress.mp3?raw=1"
  ];

  const sounds = soundFiles.map(url => {
    const audio = new Audio(url);
    audio.preload = "auto";
    audio.volume = 0.25;
    return audio;
  });

  let lastSoundTime = 0;
  const SOUND_COOLDOWN = 20;

  function playScrambleSound() {
    const now = performance.now();
    if (now - lastSoundTime < SOUND_COOLDOWN) return;
    lastSoundTime = now;

    const base = sounds[Math.floor(Math.random() * sounds.length)];
    const clone = base.cloneNode();
    clone.volume = base.volume;
    clone.play().catch(e => {});
  }

  /* ————————— WIDTH FREEZE ————————— */
  function freezeWidth(el) {
    const rect = el.getBoundingClientRect();
    el.style.width = rect.width + "px";
  }

  function unfreezeWidth(el) {
    el.style.width = "";
  }

  /* ————————— FAST SCRAMBLE ————————— */
  function scrambleText(element, textToDisplay) {
    let iteration = 0;
    const totalDuration = 2000;
    const frames = totalDuration / 30;
    const step = textToDisplay.length / frames;

    clearInterval(interval);
    freezeWidth(element);
    element.classList.add("scrambling");

    interval = setInterval(() => {
      playScrambleSound();

      element.innerText = element.innerText
        .split("")
        .map((letter, index) =>
          index < iteration
            ? textToDisplay[index]
            : letters[Math.floor(Math.random() * letters.length)]
        )
        .join("");

      if (iteration >= textToDisplay.length) {
        clearInterval(interval);
        element.classList.remove("scrambling");
        setTimeout(() => unfreezeWidth(element), 150);
      }

      iteration += step;
    }, 30);
  }

  /* ————————— EVENTS (CLICK) ————————— */
  heading.onclick = () => {
    if (isDecoded) {
      heading.classList.remove("hovered");
      scrambleText(heading, initialText);
    } else {
      heading.classList.add("hovered");
      scrambleText(heading, targetText);
    }
    isDecoded = !isDecoded;
  };
</script>

</body>
</html>
