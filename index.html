<script>
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[];',./{}:";

  let interval = null;
  const heading = document.querySelector("h1");

  /* ————————— SOUND SYSTEM ————————— */
  const soundFiles = [
    "https://raw.githubusercontent.com/USERNAME/REPO/main/scramble1.mp3?raw=1",
    "https://raw.githubusercontent.com/USERNAME/REPO/main/scramble2.mp3?raw=1",
    "https://raw.githubusercontent.com/USERNAME/REPO/main/scramble3.mp3?raw=1"
  ];

  const sounds = soundFiles.map(url => {
    const audio = new Audio(url);
    audio.preload = "auto";
    audio.volume = 0.25;
    return audio;
  });

  let lastSoundTime = 0;
  const SOUND_COOLDOWN = 20;

  function playScrambleSound() {
    const now = performance.now();
    if (now - lastSoundTime < SOUND_COOLDOWN) return;
    lastSoundTime = now;

    const base = sounds[Math.floor(Math.random() * sounds.length)];
    const clone = base.cloneNode();     // ← IMPORTANT
    clone.volume = base.volume;
    clone.play();
  }

  /* ————————— WIDTH FREEZE ————————— */
  function freezeWidth(el) {
    const rect = el.getBoundingClientRect();
    el.style.width = rect.width + "px";
  }

  function unfreezeWidth(el) {
    el.style.width = "";
  }

  /* ————————— FAST SCRAMBLE ————————— */
  function scrambleText(element, targetText) {
    let iteration = 0;
    const totalDuration = 2000;
    const frames = totalDuration / 20;
    const step = targetText.length / frames;

    clearInterval(interval);
    freezeWidth(element);
    element.classList.add("scrambling");

    interval = setInterval(() => {
      element.innerText = element.innerText
        .split("")
        .map((letter, index) =>
          index < iteration
            ? targetText[index]
            : letters[Math.floor(Math.random() * letters.length)]
        )
        .join("");

      playScrambleSound();

      if (iteration >= targetText.length) {
        clearInterval(interval);
        element.classList.remove("scrambling");
        setTimeout(() => unfreezeWidth(element), 150);
      }

      iteration += step;
    }, 30);
  }

  /* ————————— EVENTS ————————— */
  heading.onmouseover = () => {
    heading.classList.add("hovered");
    scrambleText(heading, heading.dataset.value);
  };

  heading.onmouseout = () => {
    heading.classList.remove("hovered");
    scrambleText(
      heading,
      "If you're reading this, decode this with Base 64."
    );
  };
</script>
