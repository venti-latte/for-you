<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 Scramble Smooth</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      display: grid;
      place-items: center;
      height: 100vh;
      background-color: black;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-family: "Space Mono", monospace;
      font-size: clamp(1rem, 5vw, 4rem);
      color: white;
      padding: 0rem clamp(1rem, 2vw, 3rem);
      border-radius: clamp(0.4rem, 0.75vw, 1rem);
      cursor: default;
      display: inline-block;
      white-space: nowrap;
      transition: color 0.35s ease, background-color 0.35s ease;
    }

    h1.hovered {
      background-color: white;
      color: black;
    }

    .scrambling {
      transition: opacity 0.2s ease;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <h1 data-value="aWxsIGJlIGhlcmUgd2FpdGluZyBmb3IgeW91LCBkYW5pLiA=">
    If you're reading this, decode this with Base 64.
  </h1>

  <script>
    const letters =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[];',./{}:";

    let interval = null;
    const heading = document.querySelector("h1");

    /* ————————— SOUND SYSTEM ————————— */
    const soundFiles = [
      "https://raw.githubusercontent.com/venti-latte/for-you/refs/heads/main/Futuristic%20Keypress.mp3?raw=1"
    ];

    const sounds = soundFiles.map(url => {
      const audio = new Audio(url);
      audio.preload = "auto";
      audio.volume = 0.25;
      audio.addEventListener("canplaythrough", () => {
        console.log("Loaded:", url);
      });
      return audio;
    });

    let lastSoundTime = 0;
    const SOUND_COOLDOWN = 20;

    function playScrambleSound() {
      const now = performance.now();
      if (now - lastSoundTime < SOUND_COOLDOWN) return;
      lastSoundTime = now;

      const sound = sounds[Math.floor(Math.random() * sounds.length)];
      sound.currentTime = 0;

      sound.play().catch(err => {
        console.warn("Audio blocked, retrying after gesture…", err);
      });
    }

    /* ————————— WIDTH FREEZE ————————— */
    function freezeWidth(el) {
      const rect = el.getBoundingClientRect();
      el.style.width = rect.width + "px";
    }

    function unfreezeWidth(el) {
      el.style.width = "";
    }

    /* ————————— FAST SCRAMBLE ————————— */
    function scrambleText(element, targetText) {
      let iteration = 0;
      const totalDuration = 2000;
      const frames = totalDuration / 20;
      const step = targetText.length / frames;

      clearInterval(interval);
      freezeWidth(element);
      element.classList.add("scrambling");

      interval = setInterval(() => {
        element.innerText = element.innerText
          .split("")
          .map((letter, index) =>
            index < iteration
              ? targetText[index]
              : letters[Math.floor(Math.random() * letters.length)]
          )
          .join("");

        playScrambleSound();

        if (iteration >= targetText.length) {
          clearInterval(interval);
          element.classList.remove("scrambling");
          setTimeout(() => unfreezeWidth(element), 150);
        }

        iteration += step;
      }, 30);
    }

    /* ————————— EVENTS ————————— */
    heading.onmouseover = () => {
      heading.classList.add("hovered");
      scrambleText(heading, heading.dataset.value);
    };

    heading.onmouseout = () => {
      heading.classList.remove("hovered");
      scrambleText(
        heading,
        "If you're reading this, decode this with Base 64."
      );
    };
  </script>

</body>
</html>
