<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 Scramble</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      display: grid;
      place-items: center;
      height: 100vh;
      background-color: black;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(1rem, 5vw, 4rem);
      color: white;
      padding: 0rem clamp(1rem, 2vw, 3rem);
      border-radius: clamp(0.4rem, 0.75vw, 1rem);
      transition: background-color 0.4s ease, color 0.4s ease;
      cursor: default;
    }

    h1.hovered {
      background-color: white;
      color: black;
    }
  </style>
</head>

<body>

  <h1 data-value="aWxsIGJlIGhlcmUgd2FpdGluZyBmb3IgeW91LCBkYW5pLiA=">
    If you're reading this, decode this with Base 64.
  </h1>

  <script>
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*())___+1234567890--=[];',./{}:";

    let interval = null;

    const heading = document.querySelector("h1");

    function scrambleText(element, targetText) {
      let iteration = 0;

      clearInterval(interval);

      interval = setInterval(() => {
        element.innerText = element.innerText
          .split("")
          .map((letter, index) => {
            if (index < iteration) {
              return targetText[index];
            }
            return letters[Math.floor(Math.random() * letters.length)];
          })
          .join("");

        if (iteration >= targetText.length) {
          clearInterval(interval);
        }

        iteration += 1 / 3;
      }, 30);
    }

    heading.onmouseover = () => {
      heading.classList.add("hovered");
      scrambleText(heading, heading.dataset.value);
    };

    heading.onmouseout = () => {
      heading.classList.remove("hovered");
      scrambleText(heading, "If you're reading this, decode this with Base 64.");
    };
  </script>

</body>
</html>
